name: Build All Components

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

env:
  THEOS: /opt/theos

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ldid

      - name: Install Theos
        run: |
          sudo mkdir -p /opt/theos
          sudo chown $USER /opt/theos
          git clone --recursive https://github.com/theos/theos.git /opt/theos

      - name: Download iOS SDK
        run: |
          curl -L -o /tmp/iPhoneOS16.5.sdk.tar.xz \
            "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          mkdir -p /opt/theos/sdks
          tar xJf /tmp/iPhoneOS16.5.sdk.tar.xz -C /opt/theos/sdks/

      # ── Stage 1: Build kernel exploit (type0x09) ──────────────────────
      - name: Build payload_377bed (type0x09)
        run: |
          cd src/payload_377bed
          make clean
          make package
        env:
          RECOMP_DEBUG_LOCALS: 0
          RECOMP_TRACE_DMAFAIL: 0
          RECOMP_TRACE_PHYSMAP: 0
          RECOMP_TRACE_PORTS: 0
          RECOMP_PHYSMAP_VALIDATE_CACHE: 1
          RECOMP_TEMP_FAKE_OBJC_CLASS: 0
          RECOMP_TEMP_FAKE_OBJC_ARC: 0

      # ── Stage 2: Build bootstrap ──────────────────────────────────────
      - name: Build bootstrap
        run: |
          cd src/bootstrap
          make clean
          make package

      # ── Stage 3: Build entry2 (type0x0f injection) ────────────────────
      - name: Build entry2
        run: |
          cd src/entry2
          make clean
          make package

      # ── Stage 4: Build DriverWrapper (embeds type0x09) ────────────────
      - name: Build DriverWrapper
        run: |
          # Copy the built type0x09 dylib into the expected path
          # THEOS builds each arch separately; use arm64e for both (SpringBoard is arm64e)
          mkdir -p payloads/377bed7460f7538f96bbad7bdc2b8294bdc54599
          cp src/payload_377bed/.theos/obj/arm64e/entry1_type0x09.dylib \
             payloads/377bed7460f7538f96bbad7bdc2b8294bdc54599/entry1_type0x09.dylib
          cd src/DriverWrapper
          make clean
          make package

      # ── Stage 5: Build TweakLoader ────────────────────────────────────
      - name: Build TweakLoader
        run: |
          cd TweakLoader
          make clean
          make package

      # ── Upload all artifacts ──────────────────────────────────────────
      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          # type0x09 kernel exploit
          cp src/payload_377bed/.theos/obj/arm64e/entry1_type0x09.dylib artifacts/
          # bootstrap
          cp src/bootstrap/.theos/obj/arm64/bootstrap.dylib artifacts/
          # entry2
          cp src/entry2/.theos/obj/arm64e/entry2_type0x0f.dylib artifacts/
          # DriverWrapper
          cp src/DriverWrapper/.theos/obj/arm64e/DriverWrapper.dylib artifacts/
          # TweakLoader
          cp TweakLoader/.theos/obj/arm64e/TweakLoader.dylib artifacts/
          cp TweakLoader/.theos/obj/arm64e/SpringBoardTweak.dylib artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coruna-dylibs
          path: artifacts/
          retention-days: 7
