name: Build coruna_demo
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos

      - name: Build dylib
        run: |
          export THEOS=$HOME/theos
          cd coruna_demo
          make
          mkdir -p ../payloads
          cp .theos/obj/debug/corunademo.dylib ../payloads/bootstrap.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap.dylib
          path: payloads/bootstrap.dylib
